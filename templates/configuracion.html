{% extends "base.html" %}
{% block content %}
<h1 class="section-header"><i class="fa-solid fa-gear"></i> Configuración de Cuenta</h1>

{% if error %}
<div class="alert-error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
{% endif %}

{% if success %}
<div style="background:#d4edda; color:#155724; padding:12px 18px; border-radius:8px; margin-bottom:15px; border-left:4px solid #28a745;">
    <i class="fa-solid fa-check-circle"></i> {{ success }}
</div>
{% endif %}

<!-- Cambiar Datos de Usuario -->
<div class="form-container">
    <h3 style="margin-bottom: 15px; font-size: 1rem; color: var(--text-light);">
        <i class="fa-solid fa-user"></i> Datos de Usuario
    </h3>
    <form method="POST">
        <input type="hidden" name="accion" value="cambiar_usuario">
        <div class="input-group">
            <label>Nombre *</label>
            <input type="text" name="nombre" value="{{ admin.nombre }}" required
                   pattern="[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+"
                   title="Solo se permiten letras y espacios.">
        </div>
        <div class="input-group">
            <label>Usuario *</label>
            <input type="text" name="username" value="{{ admin.username }}" required>
        </div>
        <div class="input-group">
            <label>Email (opcional, @gmail.com)</label>
            <input type="email" name="email" value="{{ admin.email }}" placeholder="usuario@gmail.com">
            <small style="color: var(--text-light); font-size: 0.7rem; display:block; margin-top:3px;">Si se llena, debe ser @gmail.com</small>
        </div>
        <button type="submit" class="btn-primary"><i class="fa-solid fa-floppy-disk"></i> Guardar Cambios</button>
    </form>
</div>

<!-- Cambiar Contraseña -->
<div class="form-container" style="margin-top: 20px;">
    <h3 style="margin-bottom: 15px; font-size: 1rem; color: var(--text-light);">
        <i class="fa-solid fa-lock"></i> Cambiar Contraseña
    </h3>
    <form method="POST">
        <input type="hidden" name="accion" value="cambiar_password">
        <div class="input-group">
            <label>Contraseña Actual *</label>
            <input type="password" name="password_actual" placeholder="••••••••" required>
        </div>
        <div class="input-group">
            <label>Nueva Contraseña *</label>
            <input type="password" name="password_nueva" placeholder="••••••••" required minlength="8">
            <small style="color: var(--text-light); font-size: 0.7rem; display:block; margin-top:3px;">Mínimo 8 caracteres.</small>
        </div>
        <div class="input-group">
            <label>Confirmar Nueva Contraseña *</label>
            <input type="password" name="password_confirmar" placeholder="••••••••" required minlength="8">
        </div>
        <button type="submit" class="btn-primary" style="background:#e67e22;">
            <i class="fa-solid fa-key"></i> Actualizar Contraseña
        </button>
    </form>
</div>
{% endblock %}
